<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ - มิสเตอร์โบโล่</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-mount"></div>

<div class="form-card">
  <h2>เข้าสู่ระบบ</h2>
  <div id="form-alert"></div>
  <form id="login-form">
    <label>อีเมล</label>
    <input type="email" name="email" required>
    <label>รหัสผ่าน</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:20px;">เข้าสู่ระบบ</button>
  </form>
  <p style="text-align:center; margin-top:16px;">ยังไม่มีบัญชี? <a href="/register.html" style="color:var(--primary); font-weight:600;">สมัครสมาชิก</a></p>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth-guard.js"></script>
<script src="/js/nav.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const nextUrl = params.get("next") || "/index.html";

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("form-alert");
  alertBox.innerHTML = "";
  const fd = new FormData(e.target);
  const payload = Object.fromEntries(fd.entries());

  try {
    await api.login(payload);
    window.location.href = nextUrl;
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
